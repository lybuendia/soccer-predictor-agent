[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-forecast-agent"
version = "0.1.0"
description = "Agentic soccer market intelligence assistant for Premier League forecasting"
readme = "approach.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.30",
    "anthropic>=0.28",
    "chromadb>=0.5",
    "httpx>=0.27",
    "mcp>=1.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
